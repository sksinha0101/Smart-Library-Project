<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart Library | Government Polytechnic Vaishali</title>


    <!-- =====================================================
         BOOTSTRAP
    ====================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- =====================================================
         BOOTSTRAP ICONS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- =====================================================
         GOOGLE FONT
    ====================================================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">


    <style>

        /* =====================================================
           RESET
        ====================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =====================================================
           BODY
        ====================================================== */

        body {

            min-height: 100vh;

            font-family: "Poppins", sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #061a36 0%,
                    #082b55 48%,
                    #0b4b80 100%
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px 20px;

            position: relative;

            overflow-x: hidden;
        }


        /* =====================================================
           BACKGROUND ORANGE CIRCLE
        ====================================================== */

        body::before {

            content: "";

            position: fixed;

            width: 330px;

            height: 330px;

            border-radius: 50%;

            background:
                rgba(239, 112, 53, 0.35);

            top: -105px;

            left: -60px;

            pointer-events: none;
        }


        /* =====================================================
           BACKGROUND BOTTOM CIRCLE
        ====================================================== */

        body::after {

            content: "";

            position: fixed;

            width: 360px;

            height: 360px;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.12);

            right: -120px;

            bottom: -120px;

            pointer-events: none;
        }


        /* =====================================================
           DOT PATTERN
        ====================================================== */

        .dots {

            position: fixed;

            width: 130px;

            height: 130px;

            background-image:
                radial-gradient(
                    rgba(255,255,255,0.65) 1.4px,
                    transparent 1.4px
                );

            background-size: 15px 15px;

            opacity: 0.20;

            pointer-events: none;
        }


        .dots-left {

            left: 55px;

            bottom: 35px;
        }


        .dots-right {

            right: 45px;

            top: 70px;
        }


        /* =====================================================
           MAIN LOGIN CARD
        ====================================================== */

        .login-card {

            width: 100%;

            max-width: 855px;

            min-height: 790px;

            background: #f8f9fa;

            border-radius: 30px;

            padding: 35px 58px 25px;

            position: relative;

            z-index: 5;

            box-shadow:
                0 25px 65px rgba(0,0,0,0.30);

            animation:
                cardAnimation 0.6s ease;
        }


        @keyframes cardAnimation {

            from {

                opacity: 0;

                transform:
                    translateY(25px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =====================================================
           LOGO CONTAINER
        ====================================================== */

        .logo-container {

            width: 175px;

            height: 175px;

            margin: 0 auto 5px;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        /* =====================================================
           GOVERNMENT POLYTECHNIC VAISHALI LOGO
           
           IMPORTANT:
           Put the actual logo file here:

           frontend/images/gp-vaishali-logo.png
        ====================================================== */

        .gp-logo {

            width: 175px;

            height: 175px;

            object-fit: contain;

            display: block;

            filter:
                drop-shadow(
                    0 8px 14px rgba(0,0,0,0.20)
                );
        }


        /* =====================================================
           TITLE
        ====================================================== */

        .main-title {

            text-align: center;

            color: #111820;

            font-size: 46px;

            font-weight: 700;

            letter-spacing: -1px;

            margin-bottom: 9px;
        }


        /* =====================================================
           ORANGE LINE
        ====================================================== */

        .title-line {

            width: 82px;

            height: 5px;

            background: #f47721;

            border-radius: 10px;

            margin: 0 auto 12px;
        }


        /* =====================================================
           SUBTITLE
        ====================================================== */

        .subtitle {

            text-align: center;

            color: #707070;

            font-size: 18px;

            margin-bottom: 39px;
        }


        /* =====================================================
           FORM LABEL
        ====================================================== */

        .form-label {

            display: block;

            color: #29343d;

            font-size: 15px;

            font-weight: 600;

            margin-bottom: 9px;
        }


        /* =====================================================
           INPUT CONTAINER
        ====================================================== */

        .input-box {

            width: 100%;

            height: 67px;

            background: #ffffff;

            border: 1px solid #d7dce1;

            border-radius: 13px;

            display: flex;

            align-items: center;

            padding: 0 17px;

            margin-bottom: 24px;

            transition: 0.25s;
        }


        .input-box:focus-within {

            border-color: #1268ad;

            box-shadow:
                0 0 0 3px
                rgba(18,104,173,0.08);
        }


        /* =====================================================
           INPUT ICON
        ====================================================== */

        .input-icon {

            width: 32px;

            color: #808080;

            font-size: 21px;

            margin-right: 9px;

            flex-shrink: 0;
        }


        /* =====================================================
           INPUT + SELECT
        ====================================================== */

        .input-box input,
        .input-box select {

            flex: 1;

            width: 100%;

            height: 100%;

            border: none;

            outline: none;

            background: transparent;

            font-family: "Poppins", sans-serif;

            font-size: 16px;

            color: #3f4348;
        }


        .input-box input::placeholder {

            color: #666;
        }


        .input-box select {

            cursor: pointer;

            appearance: auto;
        }


        /* =====================================================
           PASSWORD EYE
        ====================================================== */

        .password-eye {

            color: #808080;

            font-size: 21px;

            cursor: pointer;

            padding-left: 10px;

            transition: 0.2s;
        }


        .password-eye:hover {

            color: #1268ad;
        }


        /* =====================================================
           STUDENT / ADMIN FIELDS
        ====================================================== */

        #studentFields,
        #adminFields {

            display: none;
        }


        /* =====================================================
           OPTIONS
        ====================================================== */

        .options-row {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-top: -2px;

            margin-bottom: 27px;
        }


        /* =====================================================
           REMEMBER ME
        ====================================================== */

        .remember-box {

            display: flex;

            align-items: center;

            gap: 9px;

            color: #555;

            font-size: 15px;

            cursor: pointer;
        }


        .remember-box input {

            width: 20px;

            height: 20px;

            cursor: pointer;

            accent-color: #1268ad;
        }


        /* =====================================================
           FORGOT PASSWORD
        ====================================================== */

        .forgot-link {

            color: #0877d1;

            text-decoration: none;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;
        }


        .forgot-link:hover {

            text-decoration: underline;
        }


        /* =====================================================
           LOGIN BUTTON
        ====================================================== */

        .login-button {

            width: 100%;

            height: 68px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    90deg,
                    #0c447f,
                    #1475bd
                );

            color: white;

            font-family: "Poppins", sans-serif;

            font-size: 20px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.25s;

            box-shadow:
                0 10px 22px
                rgba(13,91,153,0.22);
        }


        .login-button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 13px 28px
                rgba(13,91,153,0.30);
        }


        .login-button:active {

            transform:
                translateY(0);
        }


        /* =====================================================
           REGISTER
        ====================================================== */

        .register-text {

            text-align: center;

            margin-top: 26px;

            color: #707070;

            font-size: 15px;
        }


        .register-link {

            color: #0877d1;

            font-weight: 700;

            text-decoration: none;

            cursor: pointer;
        }


        .register-link:hover {

            text-decoration: underline;
        }


        /* =====================================================
           SECURE TEXT
        ====================================================== */

        .secure-text {

            text-align: center;

            color: #999;

            font-size: 12px;

            margin-top: 18px;
        }


        .secure-text i {

            color: #f47721;

            margin-right: 4px;
        }


        /* =====================================================
           REGISTRATION MODAL
        ====================================================== */

        .modal-content {

            border: none;

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,0.30);
        }


        .modal-header {

            background:
                linear-gradient(
                    90deg,
                    #0c447f,
                    #1475bd
                );

            color: white;

            border: none;

            padding: 20px 25px;
        }


        .modal-title {

            font-size: 20px;

            font-weight: 600;
        }


        .modal-body {

            padding: 28px;
        }


        .modal-subtitle {

            text-align: center;

            color: #777;

            font-size: 13px;

            margin-bottom: 23px;
        }


        /* =====================================================
           REGISTRATION LABEL
        ====================================================== */

        .register-label {

            display: block;

            color: #333;

            font-size: 13px;

            font-weight: 600;

            margin-bottom: 7px;
        }


        /* =====================================================
           REGISTRATION INPUT
        ====================================================== */

        .register-input {

            width: 100%;

            height: 48px;

            border: 1px solid #d7dce1;

            border-radius: 9px;

            outline: none;

            padding: 0 13px;

            font-family: "Poppins", sans-serif;

            font-size: 13px;

            background: white;
        }


        .register-input:focus {

            border-color: #1268ad;

            box-shadow:
                0 0 0 3px
                rgba(18,104,173,0.08);
        }


        /* =====================================================
           CREATE ACCOUNT BUTTON
        ====================================================== */

        .create-account-btn {

            width: 100%;

            height: 50px;

            border: none;

            border-radius: 9px;

            background:
                linear-gradient(
                    90deg,
                    #0c447f,
                    #1475bd
                );

            color: white;

            font-family: "Poppins", sans-serif;

            font-size: 14px;

            font-weight: 600;

            margin-top: 8px;

            cursor: pointer;
        }


        .create-account-btn:hover {

            opacity: 0.94;
        }


        /* =====================================================
           RESPONSIVE
        ====================================================== */

        @media (max-width: 768px) {

            body {

                padding: 20px 12px;
            }


            .login-card {

                min-height: auto;

                padding:
                    30px 30px 25px;

                border-radius: 22px;
            }


            .logo-container {

                width: 140px;

                height: 140px;
            }


            .gp-logo {

                width: 140px;

                height: 140px;
            }


            .main-title {

                font-size: 36px;
            }


            .subtitle {

                font-size: 15px;

                margin-bottom: 30px;
            }


            .input-box {

                height: 60px;
            }


            .login-button {

                height: 60px;

                font-size: 18px;
            }
        }


        @media (max-width: 480px) {

            .login-card {

                padding:
                    25px 20px;
            }


            .main-title {

                font-size: 30px;
            }


            .subtitle {

                font-size: 13px;
            }


            .options-row {

                flex-direction: column;

                align-items: flex-start;

                gap: 12px;
            }


            .forgot-link {

                align-self: flex-end;
            }


            .dots {

                display: none;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         BACKGROUND DOTS
    ====================================================== -->

    <div class="dots dots-left"></div>

    <div class="dots dots-right"></div>


    <!-- =====================================================
         MAIN LOGIN CARD
    ====================================================== -->

    <div class="login-card">


        <!-- =================================================
             GOVERNMENT POLYTECHNIC VAISHALI LOGO
             
             Image location:
             frontend/images/gp-vaishali-logo.png
        ================================================== -->

        <div class="logo-container">

            <img
                src="https://www.gpvaishali.org/logo/logo.png"
                alt="Government Polytechnic Vaishali Logo"
                class="gp-logo"
            >

        </div>


        <!-- =================================================
             MAIN TITLE
        ================================================== -->

        <h1 class="main-title">
            Smart Library
        </h1>


        <div class="title-line"></div>


        <p class="subtitle">
            Library Management Resouce
        </p>


        <!-- =================================================
             LOGIN FORM
        ================================================== -->

        <form id="loginForm">


            <!-- SELECT ROLE -->

            <label
                for="roleSelect"
                class="form-label"
            >
                Select Role
            </label>


            <div class="input-box">

                <i
                    class="bi bi-person-badge input-icon">
                </i>


                <select
                    id="roleSelect"
                    required
                >

                    <option value="">
                        Select your role
                    </option>

                    <option value="student">
                        Student
                    </option>

                    <option value="admin">
                        Admin
                    </option>

                </select>

            </div>


            <!-- STUDENT EMAIL -->

            <div id="studentFields">

                <label
                    for="studentEmail"
                    class="form-label"
                >
                    College Email
                </label>


                <div class="input-box">

                    <i
                        class="bi bi-envelope input-icon">
                    </i>


                    <input
                        type="email"
                        id="studentEmail"
                        placeholder="Enter your college email"
                    >

                </div>

            </div>


            <!-- ADMIN USERNAME -->

            <div id="adminFields">

                <label
                    for="adminUsername"
                    class="form-label"
                >
                    Admin Username
                </label>


                <div class="input-box">

                    <i
                        class="bi bi-person-badge input-icon">
                    </i>


                    <input
                        type="text"
                        id="adminUsername"
                        placeholder="Enter admin username"
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <label
                for="loginPassword"
                class="form-label"
            >
                Password
            </label>


            <div class="input-box">

                <i
                    class="bi bi-lock input-icon">
                </i>


                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >


                <i
                    class="bi bi-eye password-eye"
                    id="passwordEye"
                    onclick="togglePassword()">
                </i>

            </div>


            <!-- REMEMBER + FORGOT -->

            <div class="options-row">


                <label class="remember-box">

                    <input
                        type="checkbox"
                        id="rememberMe"
                    >

                    <span>
                        Remember me
                    </span>

                </label>


                <a
                    href="#"
                    class="forgot-link"
                    onclick="forgotPassword(event)"
                >
                    Forgot Password?
                </a>


            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-button"
            >

                <i
                    class="bi bi-box-arrow-in-right me-2">
                </i>

                Login

            </button>

        </form>


        <!-- ONLY STUDENT REGISTER -->

        <div class="register-text">

            Don't have an account?

            <a
                href="#"
                class="register-link"
                data-bs-toggle="modal"
                data-bs-target="#registerModal"
            >
                Register
            </a>

        </div>


        <!-- SECURE LOGIN -->

        <div class="secure-text">

            <i class="bi bi-shield-lock"></i>

            Secure Smart Library Login

        </div>

    </div>


    <!-- =====================================================
         STUDENT REGISTRATION MODAL
    ====================================================== -->

    <div
        class="modal fade"
        id="registerModal"
        tabindex="-1"
        aria-hidden="true"
    >

        <div
            class="modal-dialog modal-lg modal-dialog-centered"
        >

            <div class="modal-content">


                <!-- MODAL HEADER -->

                <div class="modal-header">

                    <h5 class="modal-title">

                        <i
                            class="bi bi-person-plus me-2">
                        </i>

                        Student Registration

                    </h5>


                    <button
                        type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                    ></button>

                </div>


                <!-- MODAL BODY -->

                <div class="modal-body">


                    <h4
                        class="text-center fw-bold mb-1"
                    >
                        Create Your Account
                    </h4>


                    <p class="modal-subtitle">

                        Enter your details to create your
                        Smart Library account.

                    </p>


                    <!-- REGISTRATION FORM -->

                    <form id="registrationForm">


                        <div class="row">


                            <!-- FULL NAME -->

                            <div class="col-md-6 mb-3">

                                <label
                                    class="register-label"
                                    for="StudentName"
                                >
                                    Student Name
                                </label>


                                <input
                                    type="text"
                                    id="fullName"
                                    class="register-input"
                                    placeholder="Enter your name"
                                    required
                                >

                            </div>


                            <!-- STUDENT ROLL NO. -->

                            <div class="col-md-6 mb-3">

                                <label
                                    class="register-label"
                                    for="studentrollno."
                                >
                                    Student Roll No.
                                </label>


                                <input
                                    type="text"
                                    id="studentId"
                                    class="register-input"
                                    placeholder="Enter your Roll No."
                                    required
                                >

                            </div>


                            <!-- GMAIL -->

                            <div class="col-md-6 mb-3">

                                <label
                                    class="register-label"
                                    for="registrationGmail"
                                >
                                    Student Gmail
                                </label>


                                <input
                                    type="email"
                                    id="registrationEmail"
                                    class="register-input"
                                    placeholder="Enter your Gmail"
                                    required
                                >

                            </div>


                            <!-- MOBILE -->

                            <div class="col-md-6 mb-3">

                                <label
                                    class="register-label"
                                    for="studentmobileNo."
                                >
                                    Student Mobile No.
                                </label>


                                <input
                                    type="tel"
                                    id="mobileNumber"
                                    class="register-input"
                                    placeholder="Enter your mobile no."
                                    required
                                >

                            </div>


                            <!-- Branch -->

                            <div class="col-md-6 mb-3">

                                <label
                                    class="register-label"
                                    for="branch"
                                >      Branch
                                    
                                </label>


                                <select
                                    id="department"
                                    class="register-input"
                                    required
                                >

                                    <option value="">
                                        Select Branch
                                    </option>

                                    <option value="CSE">
                                        Computer Science & Engineering
                                    </option>

                                    <option value="ME">
                                        Mechanical Engineering
                                    </option>

                                    <option value="CE">
                                        Civil Engineering
                                    </option>

                                    <option value="EE">
                                        Electrical Engineering
                                    </option>

                                    <option value="ECE">
                                        Electronics Engineering
                                    </option>

                                </select>

                            </div>


                            <!-- SEMESTER -->

                            <div class="col-md-6 mb-3">

                                <label
                                    class="register-label"
                                    for="semester"
                                >
                                    Semester
                                </label>


                                <select
                                    id="semester"
                                    class="register-input"
                                    required
                                >

                                    <option value="">
                                        Select Semester
                                    </option>

                                    <option value="1">
                                        1st Semester
                                    </option>

                                    <option value="2">
                                        2nd Semester
                                    </option>

                                    <option value="3">
                                        3rd Semester
                                    </option>

                                    <option value="4">
                                        4th Semester
                                    </option>

                                    <option value="5">
                                        5th Semester
                                    </option>

                                    <option value="6">
                                        6th Semester
                                    </option>

                                </select>

                            </div>


                            <!-- PASSWORD -->

                            <div class="col-md-6 mb-3">

                                <label
                                    class="register-label"
                                    for="registrationPassword"
                                >
                                    Create Password
                                </label>


                                <input
                                    type="password"
                                    id="registrationPassword"
                                    class="register-input"
                                    placeholder="Create password"
                                    required
                                >

                            </div>


                            <!-- CONFIRM PASSWORD -->

                            <div class="col-md-6 mb-3">

                                <label
                                    class="register-label"
                                    for="confirmPassword"
                                >
                                    Confirm Password
                                </label>


                                <input
                                    type="password"
                                    id="confirmPassword"
                                    class="register-input"
                                    placeholder="Confirm password"
                                    required
                                >

                            </div>

                        </div>


                        <!-- CREATE ACCOUNT -->

                        <button
                            type="submit"
                            class="create-account-btn"
                        >

                            <i
                                class="bi bi-person-check me-2">
                            </i>

                            Create Account

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         BOOTSTRAP JAVASCRIPT
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- =====================================================
         CUSTOM JAVASCRIPT
    ====================================================== -->

    <script>


        /* =====================================================
           ROLE SELECT
        ====================================================== */

        const roleSelect =
            document.getElementById("roleSelect");


        const studentFields =
            document.getElementById("studentFields");


        const adminFields =
            document.getElementById("adminFields");


        const studentEmail =
            document.getElementById("studentEmail");


        const adminUsername =
            document.getElementById("adminUsername");


        roleSelect.addEventListener(
            "change",
            function () {


                /* STUDENT */

                if (this.value === "student") {

                    studentFields.style.display =
                        "block";

                    adminFields.style.display =
                        "none";

                    studentEmail.required =
                        true;

                    adminUsername.required =
                        false;
                }


                /* ADMIN */

                else if (this.value === "admin") {

                    studentFields.style.display =
                        "none";

                    adminFields.style.display =
                        "block";

                    studentEmail.required =
                        false;

                    adminUsername.required =
                        true;
                }


                /* NO ROLE */

                else {

                    studentFields.style.display =
                        "none";

                    adminFields.style.display =
                        "none";

                    studentEmail.required =
                        false;

                    adminUsername.required =
                        false;
                }

            }
        );


        /* =====================================================
           PASSWORD SHOW / HIDE
        ====================================================== */

        function togglePassword() {

            const password =
                document.getElementById(
                    "loginPassword"
                );


            const eye =
                document.getElementById(
                    "passwordEye"
                );


            if (
                password.type === "password"
            ) {

                password.type = "text";

                eye.classList.remove(
                    "bi-eye"
                );

                eye.classList.add(
                    "bi-eye-slash"
                );

            }

            else {

                password.type = "password";

                eye.classList.remove(
                    "bi-eye-slash"
                );

                eye.classList.add(
                    "bi-eye"
                );
            }

        }


        /* =====================================================
           LOGIN
        ====================================================== */

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                function(event) {


                    event.preventDefault();


                    const role =
                        roleSelect.value;


                    const password =
                        document.getElementById(
                            "loginPassword"
                        ).value;


                    /* ROLE CHECK */

                    if (role === "") {

                        alert(
                            "Please select your role."
                        );

                        return;
                    }


                    /* PASSWORD CHECK */

                    if (
                        password.trim() === ""
                    ) {

                        alert(
                            "Please enter your password."
                        );

                        return;
                    }


                    /* STUDENT LOGIN */

                    if (
                        role === "student"
                    ) {

                        const email =
                            studentEmail.value;


                        if (
                            email.trim() === ""
                        ) {

                            alert(
                                "Please enter your college email."
                            );

                            return;
                        }


                        alert(
                            "Student login successful!"
                        );

                    }


                    /* ADMIN LOGIN */

                    else if (
                        role === "admin"
                    ) {

                        const username =
                            adminUsername.value;


                        if (
                            username.trim() === ""
                        ) {

                            alert(
                                "Please enter admin username."
                            );

                            return;
                        }


                        alert(
                            "Admin login successful!"
                        );
                    }

                }
            );


        /* =====================================================
           FORGOT PASSWORD
        ====================================================== */

        function forgotPassword(event) {

            event.preventDefault();


            alert(
                "Please contact the library administrator to reset your password."
            );

        }


        /* =====================================================
           STUDENT REGISTRATION
        ====================================================== */

        document
            .getElementById("registrationForm")
            .addEventListener(
                "submit",
                function(event) {


                    event.preventDefault();


                    const password =
                        document.getElementById(
                            "registrationPassword"
                        ).value;


                    const confirmPassword =
                        document.getElementById(
                            "confirmPassword"
                        ).value;


                    /* PASSWORD MATCH */

                    if (
                        password !== confirmPassword
                    ) {

                        alert(
                            "Password and Confirm Password do not match."
                        );

                        return;
                    }


                    /* PASSWORD LENGTH */

                    if (
                        password.length < 6
                    ) {

                        alert(
                            "Password must contain at least 6 characters."
                        );

                        return;
                    }


                    /* SUCCESS */

                    alert(
                        "Student account created successfully!"
                    );


                    /* CLOSE MODAL */

                    const modalElement =
                        document.getElementById(
                            "registerModal"
                        );


                    const modal =
                        bootstrap.Modal.getInstance(
                            modalElement
                        );


                    if (modal) {

                        modal.hide();
                    }


                    /* RESET FORM */

                    document
                        .getElementById(
                            "registrationForm"
                        )
                        .reset();

                }
            );

    </script>

</body>

</html>
